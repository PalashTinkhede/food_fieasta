<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Order Confirmed | Food Fiesta</title>
	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
	<div class="auth-wrapper">
		<div class="auth-card animate-up" style="text-align: center; max-width: 480px;">
			<div style="width: 72px; height: 72px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
				<i class="fa-solid fa-check" style="font-size: 2rem; color: #15803d;"></i>
			</div>
			<h1 style="font-size: 1.75rem; margin-bottom: 12px;">Order Placed Successfully!</h1>
			<p style="color: var(--on-surface-variant); margin-bottom: 24px;">Your delicious food is being prepared. Thank you for choosing Food Fiesta.</p>
			<div style="background: var(--surface-variant); border-radius: 16px; padding: 20px; margin-bottom: 32px;">
				<p style="font-size: 0.875rem; color: var(--on-surface-variant); margin-bottom: 4px;">Total Amount</p>
				<p style="font-size: 2rem; font-weight: 800; color: var(--primary);" th:text="'₹ '+${amount}+'/-'"></p>
			</div>
			<a href="/product/back" class="btn btn-primary" style="width: 100%;">
				<i class="fa-solid fa-arrow-left"></i> Back to Orders
			</a>
		</div>
	</div>
</body>

</html>
