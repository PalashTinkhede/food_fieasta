<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<title>User : Add</title>
	<link rel="stylesheet" href="" th:href="@{/css/Add_User.css}" />
</head>

<body>
	<a th:href="@{/admin/services}">Back to Services</a>
	<div class="addUser">
		<h3 style="color: red;">ADD NEW USER/CUSTOMER</h3>
		<form action="" th:action="@{/addingUser}" method="post">
			<label for="uname">User_Name :</label>
			<input type="text" id="uname" name="uname" minlength="2" required />

			<label for="uemail">User_Email :</label>
			<input type="email" id="uemail" name="uemail" required />

			<label for="unumber">User_Number :</label>
			<input type="tel" id="unumber" name="unumber" pattern="[0-9]{10}" required />

			<label for="upassword">Temporary_Password :</label>
			<input type="password" id="upassword" name="upassword" minlength="4" required
				placeholder="Set an initial password" />

			<p th:if="${error}" th:text="${error}" style="color: red;"></p>
			<button type="submit">Add_User</button>
		</form>
	</div>
</body>

</html>
