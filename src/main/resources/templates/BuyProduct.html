<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Order Food | Food Fiesta</title>
	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body style="background: var(--surface-variant);">
	<nav class="navbar">
		<a th:href="@{/home}" class="nav-logo">
			<i class="fa-solid fa-fire-burner"></i> Food Fiesta
		</a>
		<div class="nav-links" style="align-items: center;">
			<a th:href="@{/home}">Home</a>
			<a th:href="@{/products}">Menu</a>
			<form th:action="@{/logout}" method="post" style="display:inline;">
				<button type="submit" class="btn btn-primary" style="padding: 10px 24px;">Sign Out</button>
			</form>
		</div>
	</nav>

	<main class="section-padding">
		<div class="container animate-up" style="max-width: 900px;">
			<div style="margin-bottom: 48px; text-align: center;">
				<span style="letter-spacing: 0.2em; font-weight: 800; color: var(--primary); font-size: 0.75rem; text-transform: uppercase;">Order Center</span>
				<h1 style="font-size: clamp(2rem, 4vw, 3rem); margin-top: 8px;">
					Welcome back, <span style="color: var(--primary);" th:text="${name}"></span>
				</h1>
				<p style="color: var(--on-surface-variant); margin-top: 8px;">Search a dish by name and place your order in seconds.</p>
			</div>

			<section class="panel">
				<div class="panel-head">
					<h2 class="panel-title"><i class="fa-solid fa-magnifying-glass"></i> Find a Dish</h2>
				</div>
				<form th:action="@{/product/search}" method="post"
					  style="display: flex; gap: 12px; flex-wrap: wrap;">
					<input type="text" name="productName" required placeholder="Enter the product name..."
						   class="input-field" style="flex: 1; min-width: 220px; margin-top: 0;">
					<button type="submit" class="btn btn-primary">
						<i class="fa-solid fa-magnifying-glass"></i> Search
					</button>
				</form>
				<p th:if="${message}" th:text="${message}" class="alert-error" style="margin-top: 16px; margin-bottom: 0;"></p>
			</section>

			<section th:if="${product!=null}" class="panel">
				<div class="panel-head">
					<h2 class="panel-title"><i class="fa-solid fa-cart-shopping"></i> Place Your Order</h2>
				</div>
				<form th:action="@{/product/order}" th:object="${product}" method="post">
					<div class="form-group">
						<label class="form-label">Product</label>
						<input type="text" name="oName" th:value="${product.pname}" class="input-field" readonly>
					</div>
					<div class="form-group">
						<label class="form-label">Price (₹)</label>
						<input type="text" name="oPrice" th:value="${product.pprice}" class="input-field" readonly>
					</div>
					<div class="form-group">
						<label class="form-label">Quantity</label>
						<input type="number" placeholder="Minimum: 1 KG" min="1" name="oQuantity" class="input-field" required>
					</div>
					<button type="submit" class="btn btn-primary">
						<i class="fa-solid fa-bolt"></i> Order Now
					</button>
				</form>
			</section>

			<section th:if="${orders!=null}" class="panel">
				<div class="panel-head">
					<h2 class="panel-title"><i class="fa-solid fa-receipt"></i> Your Orders</h2>
				</div>
				<div class="table-wrap">
					<table class="data-table">
						<thead>
							<tr>
								<th>Product</th>
								<th>Price</th>
								<th>Qty</th>
								<th>Total</th>
								<th>Date</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="order :${orders}">
								<td style="font-weight: 600;" th:text="${order.oName}"></td>
								<td th:text="'₹ '+${order.oPrice}"></td>
								<td th:text="${order.oQuantity}"></td>
								<td style="font-weight: 700; color: var(--primary);" th:text="'₹ '+${order.totalAmmout}"></td>
								<td th:text="${order.orderDate}"></td>
							</tr>
						</tbody>
					</table>
				</div>
			</section>
		</div>
	</main>
</body>

</html>
