<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Error | Food Fiesta</title>
	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
	<div class="auth-wrapper">
		<div class="auth-card animate-up" style="text-align: center; max-width: 480px;">
			<div style="width: 72px; height: 72px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
				<i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; color: #dc2626;"></i>
			</div>
			<h1 style="font-size: 1.75rem; margin-bottom: 12px;">Oops... Something went wrong</h1>
			<p style="color: var(--on-surface-variant); margin-bottom: 16px;">An unexpected error occurred while processing your request.</p>
			<p th:if="${message}" th:text="${message}" class="alert-error"></p>
			<a href="/home" class="btn btn-primary" style="width: 100%; margin-top: 16px;">
				<i class="fa-solid fa-house"></i> Back to Home
			</a>
		</div>
	</div>
</body>

</html>
