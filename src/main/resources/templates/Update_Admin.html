<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Update Admin | Food Fiesta</title>
	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
	<div class="auth-wrapper">
		<div style="width: 100%; max-width: 460px;">
			<a th:href="@{/admin/services}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>

			<div class="auth-card animate-up">
				<div style="margin-bottom: 32px; text-align: center;">
					<div style="width: 48px; height: 48px; background: var(--primary-container); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
						<i class="fa-solid fa-user-pen" style="color: var(--primary);"></i>
					</div>
					<h2 style="font-size: 1.5rem; margin-bottom: 8px;">Update Admin</h2>
					<p style="font-size: 0.875rem; color: var(--on-surface-variant);" th:text="'Editing admin #'+${admin.adminId}"></p>
				</div>

				<form th:action="@{'/updatingAdmin/'+${admin.adminId}}" th:object="${admin}" method="post">
					<input type="hidden" name="adminId" th:value="${admin.adminId}" />
					<div class="form-group">
						<label class="form-label">Full Name</label>
						<input type="text" name="adminName" th:value="${admin.adminName}" class="input-field" minlength="2" required>
					</div>
					<div class="form-group">
						<label class="form-label">Mobile Number</label>
						<input type="tel" name="adminNumber" th:value="${admin.adminNumber}" class="input-field" pattern="[0-9]{10}" required>
					</div>
					<div class="form-group">
						<label class="form-label">Email Address</label>
						<input type="email" name="adminEmail" th:value="${admin.adminEmail}" class="input-field" required>
					</div>

					<button type="submit" class="btn btn-primary" style="width: 100%;">
						<i class="fa-solid fa-check"></i> Save Changes
					</button>
				</form>
			</div>
		</div>
	</div>
</body>

</html>
