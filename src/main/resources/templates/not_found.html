<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Not Found | Food Fiesta</title>
	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
	<div class="auth-wrapper">
		<div class="auth-card animate-up" style="text-align: center; max-width: 480px;">
			<h1 style="font-size: 4.5rem; font-weight: 800; background: linear-gradient(120deg, var(--primary), var(--primary-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;">404</h1>
			<h2 style="font-size: 1.5rem; margin-bottom: 12px;">We couldn't find that</h2>
			<p th:if="${message}" th:text="${message}" style="color: var(--on-surface-variant); margin-bottom: 24px;"></p>
			<p th:unless="${message}" style="color: var(--on-surface-variant); margin-bottom: 24px;">The page or record you asked for doesn't exist.</p>
			<a th:href="@{/home}" class="btn btn-primary" style="width: 100%;">
				<i class="fa-solid fa-house"></i> Back to Home
			</a>
		</div>
	</div>
</body>

</html>
