<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Not Found | Food Fiesta</title>
	<style>
		body {
			font-family: sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 90vh;
			margin: 0;
			background-color: #fdfbf7;
		}

		.card {
			text-align: center;
			max-width: 520px;
			padding: 40px 24px;
		}

		h1 {
			font-size: 4rem;
			margin: 0;
			color: #c0392b;
		}

		h2 {
			margin: 8px 0 16px;
			color: #333;
		}

		p {
			color: #666;
			line-height: 1.6;
		}

		a {
			display: inline-block;
			margin-top: 24px;
			padding: 10px 24px;
			background-color: #2f4f4f;
			color: white;
			text-decoration: none;
			border-radius: 6px;
		}
	</style>
</head>

<body>
	<div class="card">
		<h1>404</h1>
		<h2>We couldn't find that</h2>
		<p th:if="${message}" th:text="${message}"></p>
		<p th:unless="${message}">The page or record you asked for doesn't exist.</p>
		<a th:href="@{/home}">Back to Home</a>
	</div>
</body>

</html>
