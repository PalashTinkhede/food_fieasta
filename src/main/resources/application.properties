# Datasource credentials come from the environment. The defaults after ':' are
# local-development conveniences only - set real values in every other setting.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodfiesta}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# 'update' is convenient in development; use 'validate' with real migrations in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# Seeds the first back-office account on an empty database. Unset = no seeding.
foodfiesta.bootstrap-admin.email=${FOODFIESTA_ADMIN_EMAIL:}
foodfiesta.bootstrap-admin.password=${FOODFIESTA_ADMIN_PASSWORD:}
